name: Release

# Every push to main is tested and built. When app/VERSION holds a version
# that has no release yet, the build is published as that release (and its
# tag is created). The installed Vistiq.exe picks up the new
# vistiq-app.zip by itself on its next start.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: pwsh
        run: |
          $v = (Get-Content app/VERSION -Raw).Trim()
          "VERSION=$v" >> $env:GITHUB_ENV
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "PUBLISH=no" >> $env:GITHUB_ENV } else { "PUBLISH=yes" >> $env:GITHUB_ENV }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Package the app
        shell: pwsh
        run: |
          Get-ChildItem -Path app -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path app/VERSION, app/vistiq, app/ui, app/workflow_image.json -DestinationPath vistiq-app.zip

      - name: Build Vistiq.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Vistiq
          --icon launcher/icon.ico
          --add-data "app;app"
          --collect-all webview
          --collect-submodules websocket
          --hidden-import clr
          launcher/launcher.py

      - name: Check the exe can load the app
        shell: pwsh
        run: |
          $env:VISTIQ_NO_UPDATE = "1"
          $p = Start-Process -FilePath dist/Vistiq.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA/Vistiq/launcher.log" -ErrorAction SilentlyContinue
            throw "Self-test failed with exit code $($p.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vistiq-${{ env.VERSION }}
          path: |
            dist/Vistiq.exe
            vistiq-app.zip

      - name: Publish release
        if: env.PUBLISH == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v${{ env.VERSION }}" dist/Vistiq.exe vistiq-app.zip `
            --target "${{ github.sha }}" --title "Vistiq ${{ env.VERSION }}" `
            --notes-file CHANGELOG.md --latest
